name: Build & Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build & Test
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Restore dependencies
        run: dotnet restore Spur.csproj

      - name: Build (Release)
        run: dotnet build Spur.csproj -c Release --no-restore

      - name: Test
        run: |
          $testProjects = Get-ChildItem -Recurse -Filter "*.csproj" | Where-Object { $_.Name -match '[Tt]est' }
          if ($testProjects) {
            dotnet test --no-build -c Release --verbosity normal
          } else {
            Write-Host "No test projects found, skipping tests."
          }

  release:
    name: Publish & Release
    needs: build
    runs-on: windows-latest
    if: startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Publish self-contained (win-x64)
        run: dotnet publish Spur.csproj -c Release -r win-x64 --self-contained true -o publish

      - name: Archive release
        run: Compress-Archive -Path publish/* -DestinationPath Spur-win-x64.zip

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Spur-win-x64
          path: publish/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: Spur-win-x64.zip
          generate_release_notes: true
